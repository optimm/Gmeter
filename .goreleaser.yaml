# Release build: on a pushed v* tag, .github/workflows/release.yml runs this.
# It builds gmeter for macOS, Linux and Windows, attaches the archives to a
# GitHub Release, pushes a Homebrew cask to github.com/optimm/homebrew-tap (so
# `brew install optimm/tap/gmeter` works), and publishes a multi-arch image to
# ghcr.io/optimm/gmeter.
version: 2
project_name: gmeter

builds:
  - id: gmeter
    main: ./cmd/gmeter
    binary: gmeter
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

# The image holds the linux binary and nothing else (see Dockerfile), so GoReleaser
# builds it from the binaries above instead of compiling again.
dockers_v2:
  - images:
      - ghcr.io/optimm/gmeter
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: gmeter
      org.opencontainers.image.description: Open-loop load generator for HTTP and gRPC
      org.opencontainers.image.source: https://github.com/optimm/Gmeter
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

homebrew_casks:
  - name: gmeter
    binaries: [gmeter]
    homepage: https://optimm.github.io/Gmeter/
    description: Open-loop load generator for HTTP and gRPC that measures latency from when each request was due
    repository:
      owner: optimm
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:optimm/homebrew-tap.git
        # a deploy key that can write to the tap and nothing else
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "gmeter {{ .Tag }}"
    hooks:
      post:
        # the binaries are not signed by Apple, so clear the download quarantine
        # or macOS refuses to run gmeter
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/gmeter"]
          end
